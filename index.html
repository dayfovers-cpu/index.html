    const showcase = document.getElementById('productShowcase');
const noDataMessage = document.getElementById('noDataMessage');

function renderShowcase(data) {
    showcase.innerHTML = "";

    if (data.length === 0) {
        noDataMessage.classList.remove('d-none');
        return;
    }

    noDataMessage.classList.add('d-none');

    data.forEach(product => {
        const price = new Intl.NumberFormat('id-ID', {
            style: 'currency',
            currency: 'IDR'
        }).format(product.price);

       
        
      

        const card = document.createElement("div");
        card.className = "product-card";

        card.innerHTML = `
           <div class="product-image-wrapper">
    <img src="${product.image}" class="product-img">
</div>

            <div class="product-body">

    <div class="product-id">
        Produk #${product.id}
    </div>
               

                <div class="product-title">
                    ${product.name}
                </div>

                <div class="product-price">
                    ${price}
                </div>

                <button class="product-btn"
                    onclick="window.open('${product.link}','_blank')">
                    beli
                </button>
            </div>
        `;

        showcase.appendChild(card);
    });
}

    // 3. Fungsi Search (Filter)
function searchProducts() {
    const input = document.getElementById('searchInput');
    const filter = input.value.toLowerCase();

    const filteredData = products.filter(product =>
        product.name.toLowerCase().includes(filter) ||
        product.category.toLowerCase().includes(filter) ||
        product.id.toString().includes(filter)
    );

    renderShowcase(filteredData);
}
// Load awal
renderShowcase(products);
    
    function filterCategory(category, button) {

    // Hapus active dari semua tombol
    document.querySelectorAll('.category-btn')
        .forEach(btn => btn.classList.remove('active'));

    // Tambah active ke tombol yg diklik
    button.classList.add('active');

    if (category === 'Semua') {
        renderShowcase(products);
    } else {
        const filtered = products.filter(product =>
            product.category === category
        );
        renderShowcase(filtered);
    }
}
