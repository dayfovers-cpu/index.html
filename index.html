<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showcase Produk - Daftar Harga</title>
    <!-- Menggunakan Bootstrap 5 untuk desain cepat dan responsif -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icon Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 1000px;
            margin-top: 50px;
            margin-bottom: 50px;
        }
        .card {
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 12px;
        }
        .table-header {
            background-color: #0d6efd;
            color: white;
        }
        /* Membuat baris tabel bisa diklik */
        .clickable-row {
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .clickable-row:hover {
            background-color: #f1f1f1 !important;
        }
        /* Efek visual saat klik */
        .clickable-row:active {
            background-color: #e2e6ea;
        }
        .product-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 5px;
        }
        .search-box {
            border-radius: 20px;
            padding-left: 20px;
        }
    
/* GRID Lynkid Affiliate */
#productShowcase {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
}

/* Card */
.product-card {
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    overflow: hidden;
    transition: 0.2s;
}

.product-card:hover {
    transform: translateY(-4px);
}

/* Gambar */
.product-img {
    width: 100%;
    height: 140px;
    object-fit: cover;
}

/* Isi */
.product-body {
    padding: 12px;
}

.product-title {
    font-weight: 600;
    font-size: 14px;
    line-height: 1.3;
    height: 36px;
    overflow: hidden;
}

.product-earn {
    color: #00a86b;
    font-weight: 700;
    font-size: 13px;
    margin-top: 6px;
}

.product-price {
    font-size: 13px;
    color: #555;
}

/* Tombol */
.product-btn {
    margin-top: 10px;
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 8px;
    background: linear-gradient(90deg,#2ecc71,#27ae60);
    color: white;
    font-weight: 600;
}
    .product-earn {
    color: #00a86b;
}
    .product-id {
    font-size: 12px;
    font-weight: 600;
    color: #888;
    margin-bottom: 4px;
}
    
    .category-wrapper {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 10px;
    margin-bottom: 20px;
}

.category-btn {
    border: none;
    padding: 8px 16px;
    border-radius: 50px;
    background: #f1f3f5;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: 0.2s;
}

.category-btn:hover {
    background: #e2e6ea;
}

.category-btn.active {
    background: linear-gradient(90deg,#2ecc71,#27ae60);
    color: white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}
    </style>
</head>
<body>

<div class="container">
    <div class="card p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0"><i class="bi bi-bag-check"></i> Showcase Produk</h2>
            
        </div>

       <!-- Fitur Search -->
<div class="mb-4">
    <input type="text"
           id="searchInput"
           class="form-control search-box"
           placeholder="Cari nama produk..."
        onkeyup="searchProducts()">
</div>
        
        <div class="category-wrapper">
    <button class="category-btn active" onclick="filterCategory('Semua', this)">Semua</button>
    <button class="category-btn" onclick="filterCategory('Olahraga', this)">Olahraga</button>
    <button class="category-btn" onclick="filterCategory('Aksesoris', this)">Aksesoris</button>
    <button class="category-btn" onclick="filterCategory('Elektronik', this)">Elektronik</button>
    <button class="category-btn" onclick="filterCategory('Fashion', this)">Fashion</button>
    </div>

<!-- Showcase Lynkid -->
<div id="productShowcase" class="d-grid gap-3"></div>
        
        
</div>
        
        <!-- Pesan jika data tidak ditemukan -->
        <div id="noDataMessage" class="text-center py-5 d-none">
            <i class="bi bi-emoji-frown fs-1 text-muted"></i>
            <p class="mt-2 text-muted">Produk tidak ditemukan.</p>
        </div>
    </div>
</div>

<!-- JavaScript Logic -->
<script>
    // 1. Data Produk (Mock Data - Anda bisa mengubahnya sesuai kebutuhan)
    const products = [
        {
            id: 1,
            name: "VANS - Super Lowpro - multi - Wanita Sepatu",
            category: "Olahraga",
            price: 1439100,
            image: "shopping.webp",
            link: "https://tokopedia.com" // Ganti dengan link asli
        },
        {
            id: 2,
            name: "Flazhback Sepatu Slip On Pria Anti Slip Bahan Kanvas Ukuran 39 Sampai 43 Outsole Di Jahit",
            category: "Aksesoris",
            price: 210000,
            image: "shopping (2).webp",
            link: "https://shopee.com" 
        },
        {
            id: 3,
            name: "Lexier Sepatu Sneakers Pria Kulit 100% Original Import Premium Quality New Model Terbaru Casual Men Shoes",
            category: "Elektronik",
            price: 149000,
            image: "shopping (3).webp",
            link: "https://lazada.com"
        },
        {
            id: 4,
            name: "Skechers Hillcrest Men's Sneaker",
            category: "Elektronik",
            price: 1099000,
            image: "IMG_20260219_214438.jpg",
            link: "https://tokopedia.com"
        },
        {
            id: 5,
            name: "Soft Stride - Sepatu Latihan Marathon Dengan Traksi & Stabilitas Tinggi",
            category: "Fashion",
            price: 399800,
            image: "shopping (7).webp",
            link: "https://shopee.com"
        }
    ];

    const showcase = document.getElementById('productShowcase');
const noDataMessage = document.getElementById('noDataMessage');

function renderShowcase(data) {
    showcase.innerHTML = "";

    if (data.length === 0) {
        noDataMessage.classList.remove('d-none');
        return;
    }

    noDataMessage.classList.add('d-none');

    data.forEach(product => {
        const price = new Intl.NumberFormat('id-ID', {
            style: 'currency',
            currency: 'IDR'
        }).format(product.price);

       
        
      

        const card = document.createElement("div");
        card.className = "product-card";

        card.innerHTML = `
            <img src="${product.image}" class="product-img">

            <div class="product-body">

    <div class="product-id">
        Produk #${product.id}
    </div>
               

                <div class="product-title">
                    ${product.name}
                </div>

                <div class="product-price">
                    ${price}
                </div>

                <button class="product-btn"
                    onclick="window.open('${product.link}','_blank')">
                    beli
                </button>
            </div>
        `;

        showcase.appendChild(card);
    });
}
    // 3. Fungsi Search (Filter)
function searchProducts() {
    const input = document.getElementById('searchInput');
    const filter = input.value.toLowerCase();

    const filteredData = products.filter(product =>
        product.name.toLowerCase().includes(filter) ||
        product.category.toLowerCase().includes(filter) ||
        product.id.toString().includes(filter)
    );

    renderShowcase(filteredData);
}
// Load awal
renderShowcase(products);
    
    function filterCategory(category, button) {

    // Hapus active dari semua tombol
    document.querySelectorAll('.category-btn')
        .forEach(btn => btn.classList.remove('active'));

    // Tambah active ke tombol yg diklik
    button.classList.add('active');

    if (category === 'Semua') {
        renderShowcase(products);
    } else {
        const filtered = products.filter(product =>
            product.category === category
        );
        renderShowcase(filtered);
    }
}
</script>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
